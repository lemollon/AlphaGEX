# Render Blueprint for AlphaGEX
# Active AlphaGEX scope: VALOR + crypto perpetuals.
# SpreadWorks remains a separate protected service below.
# IronForge remains separate at ironforge/render.yaml and is not modified here.

services:
  - type: web
    name: alphagex-api
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install --retries 10 --timeout 120 --no-cache-dir -r requirements-render.txt"
    startCommand: "./start.sh"
    healthCheckPath: /health
    gracePeriodSeconds: 60
    envVars:
      - key: TZ
        value: America/Chicago
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TRADING_VOLATILITY_API_KEY
        sync: false
      - key: TRADING_VOLATILITY_API_TOKEN
        sync: false
      - key: TV_USERNAME
        sync: false
      - key: COINGLASS_API_KEY
        sync: false
      - key: COINBASE_API_KEY
        sync: false
      - key: COINBASE_API_SECRET
        sync: false
      - key: COINBASE_DEDICATED_API_KEY
        sync: false
      - key: COINBASE_DEDICATED_API_SECRET
        sync: false
      - key: TASTYTRADE_USERNAME
        sync: false
      - key: TASTYTRADE_PASSWORD
        sync: false
      - key: TASTYTRADE_ACCOUNT_ID
        sync: false
      - key: TASTYTRADE_CLIENT_SECRET
        sync: false
      - key: TASTYTRADE_REFRESH_TOKEN
        sync: false
      - key: MES_MICROSTRUCTURE_COLLECTOR_ENABLED
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://alphagex-frontend.vercel.app,https://*.vercel.app,http://localhost:3000,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: alphagex-db
          property: connectionString

  - type: worker
    name: alphagex-trader
    runtime: python
    plan: starter
    branch: main
    autoDeploy: true
    gracePeriodSeconds: 60
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --retries 10 --timeout 120 --no-cache-dir -r requirements.txt
    startCommand: cd /opt/render/project/src && PYTHONPATH=/opt/render/project/src python scheduler/trader_scheduler.py
    envVars:
      - key: TZ
        value: America/Chicago
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TV_USERNAME
        sync: false
      - key: TRADING_VOLATILITY_API_KEY
        sync: false
      - key: TRADING_VOLATILITY_API_TOKEN
        sync: false
      - key: TASTYTRADE_USERNAME
        sync: false
      - key: TASTYTRADE_PASSWORD
        sync: false
      - key: TASTYTRADE_ACCOUNT_ID
        sync: false
      - key: TASTYTRADE_CLIENT_SECRET
        sync: false
      - key: TASTYTRADE_REFRESH_TOKEN
        sync: false
      - key: COINBASE_API_KEY
        sync: false
      - key: COINBASE_API_SECRET
        sync: false
      - key: COINBASE_DEDICATED_API_KEY
        sync: false
      - key: COINBASE_DEDICATED_API_SECRET
        sync: false
      - key: COINGLASS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: alphagex-db
          property: connectionString

  # SERVICE: SpreadWorks Discord Daily Bot
  # Posts daily Bible verse + trading tip at market open, economic countdowns,
  # and closing reflections to Discord.
  - type: worker
    name: spreadworks-daily-bot
    runtime: python
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --retries 10 --timeout 120 --no-cache-dir -r scripts/discord_bot/requirements.txt
    startCommand: cd /opt/render/project/src/scripts/discord_bot && python main.py
    envVars:
      - key: TZ
        value: America/Chicago
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      # Master switch for ALL SpreadWorks Discord posts. Flip to "true" to re-enable.
      - key: SPREADWORKS_DISCORD_ENABLED
        value: "false"

databases:
  - name: alphagex-db
    databaseName: alphagex
    user: alphagex
    plan: starter
    region: oregon
