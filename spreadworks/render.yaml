# Render Blueprint for SpreadWorks
# Double Diagonal & Calendar Spread Analyzer
# 3 services: Static Frontend + Python Backend + Node Discord Bot
#
# NOTE: spreadworks-backend (srv-d6mv30f5gffc73bog9a0) was created
# from this blueprint then its live Build Command drifted in the
# dashboard to pip-only. Source of truth for the LIVE service is the
# dashboard, not this file - so SERVICE 2's buildCommand below must be
# kept in step with it by hand.
#
# 2026-08-19: the drift was never harmless. With a pip-only command the
# frontend is not built at deploy time, so spreadworks/frontend/dist had
# to be COMMITTED and served from the repo - which made a stale bundle a
# silent way to revert the live page, and needed a CI hash guard to
# police it.
#
# Verified on a throwaway service (spreadworks-nodeprobe) that Render's
# python runtime DOES ship node - /home/render/envwrappers/node, Node
# 24.14.1 - and that `npm ci && npm run build` completes there in 32s,
# emitting the same index-CSlFfUDf.css that CI and a local build produce.
# So the npm steps below are safe to run on this runtime; the fear that
# they were not is what kept the committed-dist workaround alive.

services:
  # SERVICE 1: React Frontend (Vite static build)
  - type: web
    name: spreadworks-frontend
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: cd spreadworks/frontend && npm install && npm run build
    staticPublishPath: spreadworks/frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # REQUIRED: Set to the spreadworks-backend URL in Render dashboard
        # e.g. https://spreadworks-backend.onrender.com
        # Without this, all API calls fail (static site can't reach backend)
        sync: false

  # SERVICE 2: Python Backend API (FastAPI)
  # NOTE: The backend also serves the frontend at /
  # You can skip the static frontend service and access this URL directly
  - type: web
    name: spreadworks-backend
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: cd spreadworks && pip install --upgrade pip && pip install -r requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: cd spreadworks && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: America/Chicago
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TRADIER_TOKEN
        sync: false
      - key: TRADIER_ACCOUNT_ID
        sync: false
      - key: ALPHAGEX_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: alphagex-db
          property: connectionString

  # SERVICE 3: Discord Bot (Node.js worker)
  - type: worker
    name: spreadworks-bot
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: cd spreadworks/bot && npm install
    startCommand: cd spreadworks/bot && node src/index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: VITE_API_URL
        sync: false

# No separate database — shares alphagex-db from main render.yaml
