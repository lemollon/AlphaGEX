name: AlphaGEX CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # Backend Tests (Python)
  # ============================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: alphagex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt || true
          pip install pandas numpy psycopg2-binary

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/alphagex_test
        run: |
          python -m pytest tests/ \
            --ignore=tests/e2e/ \
            --ignore=tests/test_api_connections.py \
            --ignore=tests/test_autonomous_trader.py \
            -v --tb=short \
            --override-ini="addopts=" \
            || true


  # ============================================================================
  # Frontend Build & Lint (TypeScript/Next.js)
  # ============================================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint || true

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npm run build



  # ============================================================================
  # SpreadWorks backend tests
  # ----------------------------------------------------------------------------
  # spreadworks/ had NO CI coverage at all - the backend-tests job above runs the
  # repo-root tests/, not spreadworks/tests/. The squeeze signal, the gamma
  # capture, the freshness and job-status guards and the VIX phantom-session
  # prune all live under spreadworks/ and none of them ran on a PR.
  # ============================================================================
  spreadworks-tests:
    name: SpreadWorks Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: spreadworks/requirements.txt

      - name: Install dependencies
        working-directory: spreadworks
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: spreadworks
        run: python -m pytest tests/ -q

  # ============================================================================
  # SpreadWorks dist freshness
  # ----------------------------------------------------------------------------
  # spreadworks/frontend/dist is a TRACKED deploy artifact. The live Render
  # service builds pip-only (its build command drifted from the blueprint, which
  # DOES build the frontend), so whatever is committed under dist/ is literally
  # what ships. Two ways that has silently broken the site:
  #
  #   1. Edit src/, forget to rebuild -> the page never changes in production
  #      and nothing anywhere says so.
  #   2. Merge a branch created before someone else's rebuild -> that branch
  #      carries an older dist and REVERTS the live bundle.
  #
  # Neither shows up in tests, in review, or in the deploy log. This job is the
  # only thing that can catch them.
  # ============================================================================
  spreadworks-dist:
    name: SpreadWorks dist is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CHECK A - pure git, cannot flake. If src changed, dist must have too.
      - name: src changed without a rebuild?
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          SRC=$(echo "$CHANGED" | grep -c '^spreadworks/frontend/src/' || true)
          DIST=$(echo "$CHANGED" | grep -c '^spreadworks/frontend/dist/' || true)
          echo "changed under src/: $SRC   under dist/: $DIST"
          if [ "$SRC" -gt 0 ] && [ "$DIST" -eq 0 ]; then
            echo "::error::spreadworks/frontend/src changed but dist/ did not."
            echo "dist is the deploy artifact - the live service does not build it."
            echo "Run: cd spreadworks/frontend && npm run build   then commit dist/."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: spreadworks/frontend/package-lock.json

      - name: Install (locked toolchain)
        working-directory: spreadworks/frontend
        run: npm ci

      # CHECK B - authoritative. vite/rollup/esbuild are pinned exactly by the
      # lockfile, so npm ci + build is reproducible across machines.
      - name: Rebuild and compare against the committed bundle
        working-directory: spreadworks/frontend
        run: |
          manifest() { (ls -1 dist/assets | sort; echo '--'; grep -o 'assets/[A-Za-z0-9_.-]*' dist/index.html | sort) ; }
          manifest > /tmp/committed.txt
          npm run build --silent
          manifest > /tmp/rebuilt.txt
          if ! diff -u /tmp/committed.txt /tmp/rebuilt.txt > /tmp/manifest.diff; then
            echo "::error::The committed dist/ does not match a fresh build."
            echo
            echo "Most likely: src was changed without rebuilding, or a merge"
            echo "brought back an older dist/. Fix with:"
            echo "    cd spreadworks/frontend && npm run build && git add dist"
            echo
            echo "Far less likely: the build toolchain drifted. vite, rollup and"
            echo "esbuild are pinned exactly in package-lock.json, so if THAT is"
            echo "the cause the lockfile changed in this PR."
            echo
            cat /tmp/manifest.diff
            exit 1
          fi
          echo "dist matches a fresh build."

  # ============================================================================
  # E2E Tests (Playwright)
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================================================
  # Security Scan
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # Production Verification (on main branch only)
  # ============================================================================
  production-verify:
    name: Production Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install requests

      - name: Run production verification
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            python scripts/verify_production.py "$API_URL" || true
          else
            echo "PRODUCTION_API_URL not set, skipping verification"
          fi
