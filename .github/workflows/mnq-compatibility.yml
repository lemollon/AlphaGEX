name: MNQ legacy compatibility correction
on:
  push:
    branches: [feature/mnq-cash-breakout-v1]
    paths: ['.github/workflows/mnq-compatibility.yml']
permissions:
  contents: write
jobs:
  correct:
    if: github.ref == 'refs/heads/feature/mnq-cash-breakout-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mnq-cash-breakout-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Keep legacy management independent from the MNQ mixin
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trading/valor/trader.py')
          s=p.read_text()
          old='            if self._is_mnq_breakout(position):\n'
          new='            if position.ticker == "MNQ" and position.signal_source == SignalSource.MNQ_BREAKOUT_30M:\n'
          assert s.count(old)==2
          p.write_text(s.replace(old,new))
          PY
          python -m compileall -q trading/valor
          python -m unittest discover -s tests/valor -p 'test_mnq_breakout*.py' -v
          git diff --check
      - name: Commit correction on feature branch only
        run: |
          test "${GITHUB_REF}" = 'refs/heads/feature/mnq-cash-breakout-v1'
          git add trading/valor/trader.py
          git rm .github/workflows/mnq-compatibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(valor): keep legacy replay independent of MNQ adapter helpers'
          git push origin HEAD:refs/heads/feature/mnq-cash-breakout-v1
